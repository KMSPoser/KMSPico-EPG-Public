name: Refresh verified EPG supplement

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generator
        run: python -m unittest discover -s tests -q
      - name: Build approved supplement
        run: python epg_public.py
      - name: Audit XMLTV before publication
        run: python publication_gate.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.xml docs/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified EPG supplement'
            git push
          fi
